name: Build merchant Android APK

on:
  repository_dispatch:
    types: [build-merchant-app]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate dispatch payload and create merchant manifest
        env:
          DISPATCH_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          echo "$DISPATCH_PAYLOAD" > dispatch-payload.json
          dart run tool/prepare_merchant_manifest_from_dispatch.dart \
            dispatch-payload.json merchant-build.json

      - name: Apply merchant build
        run: dart run tool/apply_merchant_build.dart merchant-build.json

      - name: Test
        continue-on-error: true
        run: flutter test

      - name: Build APK
        run: |
          VERSION=$(jq -r '.version' merchant-build.json)
          BUILD_NUMBER=$(jq -r '.buildNumber' merchant-build.json)
          flutter build apk --release \
            --build-name="$VERSION" \
            --build-number="$BUILD_NUMBER"

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.client_payload.tenant_slug }}-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK to GoFile
        id: upload_gofile
        run: |
          RESPONSE=$(curl -sS -F "file=@build/app/outputs/flutter-apk/app-release.apk" https://store1.gofile.io/contents/uploadfile)
          DOWNLOAD_URL=$(echo "$RESPONSE" | jq -r '.data.downloadPage // empty')
          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "GoFile upload failed: $RESPONSE"
            exit 1
          fi
          echo "DOWNLOAD_URL=$DOWNLOAD_URL" >> "$GITHUB_ENV"

      - name: Send Download Link to Telegram
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            تم بناء تطبيق أندرويد جديد بنجاح.

            اسم التطبيق: ${{ github.event.client_payload.app_name }}
            المعرّف (Slug): ${{ github.event.client_payload.tenant_slug }}
            رقم البناء: #${{ github.event.client_payload.build_number || 1 }}
            الإصدار: ${{ github.event.client_payload.version || '1.0.0' }}

            رابط تحميل الـ APK:
            ${{ env.DOWNLOAD_URL }}
